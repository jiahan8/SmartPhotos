# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 4g, not the 2g that was here while this was a four-module build. Fifteen modules configuring and
# compiling in parallel (see org.gradle.parallel below) hold far more in the daemon at once, and
# the failure mode is an OOM or a silent fall back to a slower path rather than an obvious error.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Build the independent modules concurrently. Off until now because the graph was a straight
# chain -- :app -> :core:data -> :core:domain -- with nothing to overlap. :core:ui is the first
# sibling of :core:data (neither depends on the other), so this now has something to do, and it
# has more to do with every feature module extracted after it.
org.gradle.parallel=true

# Reuse task outputs across builds and between clean builds, keyed by inputs. Worth more than
# `parallel` on a module graph this shape: a change confined to one module leaves the other three
# modules' compilation cacheable rather than merely parallel.
org.gradle.caching=true

# Skip the configuration phase entirely when nothing that feeds it has changed, reusing the
# serialized task graph. `caching` above skips work whose *inputs* are unchanged; this skips
# deciding what the work is -- which is the half that grew with the module count, since every
# build configures all fifteen projects before running a task in one of them.
#
# Verified clean on this graph: `assembleDebug --configuration-cache` stores with zero problems
# and reuses. If a change here does report a problem, the offender is nearly always a task action
# capturing a Project reference; the report Gradle links names the task.
org.gradle.configuration-cache=true

# Fail the build on a configuration-cache problem rather than degrading to `warn`, which reports and
# carries on. This is already Gradle's default; it is stated so that the choice is a decision rather
# than an accident, because `warn` is the reflex fix when a problem appears and it turns the cache
# into something that silently stops applying.
org.gradle.configuration-cache.problems=fail
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false