name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build, test and lint
    runs-on: ubuntu-latest
    # 40, not 30: the release build added an R8 pass to a job that already builds debug, runs 410
    # tests, diffs the goldens and lints. A timeout is a confusing way to learn a job got slower.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: the Robolectric-backed unit tests abort under 17 with
      # "Android SDK 36 requires Java 21" before running any test code.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its android-all-instrumented jars into ~/.m2 (~500MB), which
      # setup-gradle's ~/.gradle cache does not cover -- without this they are re-fetched
      # on every run. Keyed on the version catalog since that pins the Robolectric version.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # The Google Services plugin fails the build if this file is missing, and it is
      # gitignored (see app/.gitignore), so CI has to restore it from a secret.
      # Create the secret once with:  base64 -i app/google-services.json | pbcopy
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Generate it with 'base64 -i app/google-services.json'."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The release variant, which nothing else here compiles. Every other step in this job builds
      # debug -- assembleDebug above, testDebugUnitTest, verifyRoborazziDebug, lintDebug -- so a
      # dependency that reaches a module only through `debugImplementation` used to compile clean
      # all the way to a green tick and then fail `./gradlew assembleRelease` on someone's laptop.
      # That is not hypothetical: :feature:auth's `@Preview` resolved through the feature
      # convention's debugImplementation(ui-tooling) and broke compileReleaseKotlin for several
      # commits without this job noticing. It also puts R8 in the pipeline, so a missing keep rule
      # is caught here rather than in a release build.
      #
      # -x uploadCrashlyticsMappingFileRelease: assembleRelease wires that task in, and it uploads
      # a mapping file to Firebase. CI builds a release APK on every pull request and ships none of
      # them, so the upload would be noise in Crashlytics and a network call that can fail for
      # reasons that have nothing to do with the change under test. Real releases are built
      # elsewhere and still upload.
      #
      # There is no signing config, so this produces an unsigned APK. That is fine: the point is
      # that the variant compiles and shrinks, not that the artifact is installable.
      - name: Build release APK
        if: ${{ !cancelled() }}
        run: ./gradlew assembleRelease -x uploadCrashlyticsMappingFileRelease

      # :core:domain is named explicitly because it is a plain Kotlin JVM module: its unit tests
      # run under `test`, not the Android `testDebugUnitTest` variant task, so a bare
      # testDebugUnitTest would skip them silently rather than fail. Every other module is an
      # Android library, so the unqualified testDebugUnitTest reaches it, as does lintDebug below
      # and verifyRoborazziDebug in the four modules that apply the roborazzi plugin.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:domain:test

      # Uploaded here, before the screenshot step below re-runs the test task with a filter and
      # rewrites the screenshot modules' test-results/ down to just the screenshot classes.
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          # One entry per module with unit tests, because the globs are literal paths -- the
          # same hand-maintained list as the reports below. It had drifted: :core:ui,
          # :feature:explore and :feature:settings all had suites that reported nothing here, so a
          # failure in one came back as a red X with no report to open. Filled in when
          # :core:common and :feature:auth were added, and extended again for :feature:profile and
          # :feature:favorite. **A new module with tests has to be added here by hand.**
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            core/common/build/reports/tests/testDebugUnitTest/
            core/common/build/test-results/testDebugUnitTest/
            core/data/build/reports/tests/testDebugUnitTest/
            core/data/build/test-results/testDebugUnitTest/
            core/domain/build/reports/tests/test/
            core/domain/build/test-results/test/
            core/ui/build/reports/tests/testDebugUnitTest/
            core/ui/build/test-results/testDebugUnitTest/
            feature/auth/build/reports/tests/testDebugUnitTest/
            feature/auth/build/test-results/testDebugUnitTest/
            feature/explore/build/reports/tests/testDebugUnitTest/
            feature/explore/build/test-results/testDebugUnitTest/
            feature/favorite/build/reports/tests/testDebugUnitTest/
            feature/favorite/build/test-results/testDebugUnitTest/
            feature/home/build/reports/tests/testDebugUnitTest/
            feature/home/build/test-results/testDebugUnitTest/
            feature/note/build/reports/tests/testDebugUnitTest/
            feature/note/build/test-results/testDebugUnitTest/
            feature/preview/build/reports/tests/testDebugUnitTest/
            feature/preview/build/test-results/testDebugUnitTest/
            feature/profile/build/reports/tests/testDebugUnitTest/
            feature/profile/build/test-results/testDebugUnitTest/
            feature/search/build/reports/tests/testDebugUnitTest/
            feature/search/build/test-results/testDebugUnitTest/
            feature/settings/build/reports/tests/testDebugUnitTest/
            feature/settings/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      # Split from the unit tests so a red X says which kind of thing broke: logic or pixels.
      # testDebugUnitTest *runs* the Roborazzi tests but never diffs them against the goldens
      # in each module's src/test/screenshots/ -- only verifyRoborazziDebug compares. Scoping it to the
      # screenshot package re-runs just those tests instead of the whole suite, which costs a
      # few seconds rather than doubling the test time. The filter is on the package, not a
      # class-name pattern, so a future screenshot test can't quietly escape verification.
      #
      # `!cancelled()` so a unit-test failure above still reports screenshot status in the same
      # run, instead of hiding it behind a fix-and-push cycle.
      #
      # On failure, download the screenshot-and-lint-reports artifact: the *_compare.png files
      # show reference / diff / actual. Re-record intended changes with recordRoborazziDebug.
      - name: Screenshot verification
        if: ${{ !cancelled() }}
        run: ./gradlew verifyRoborazziDebug --tests "com.jiahan.smartcamera.screenshot.*"

      # Also `!cancelled()`, for the same reason: report every check in one run rather than
      # surfacing them one fix-and-push at a time.
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      - name: Upload screenshot and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-and-lint-reports
          # One entry per module that produces the report, because the globs are literal paths.
          # Four modules capture screenshots now -- :core:ui, :feature:home, :feature:search and
          # :feature:settings -- and a golden failure in any of them is only diagnosable if its
          # *_compare.png files come back. :core:ui's was missing from this list for a release
          # after NoteItemScreenshotTest moved there, which would have made a failure there report
          # with no images at all. :app is off the list entirely now: ScreenScreenshotTest split
          # between home and search, so the roborazzi plugin left :app with the goldens.
          path: |
            core/ui/build/outputs/roborazzi/
            feature/home/build/outputs/roborazzi/
            feature/search/build/outputs/roborazzi/
            feature/settings/build/outputs/roborazzi/
            app/build/reports/lint-results-debug.html
            core/common/build/reports/lint-results-debug.html
            core/data/build/reports/lint-results-debug.html
            core/ui/build/reports/lint-results-debug.html
            core/testing/build/reports/lint-results-debug.html
            feature/auth/build/reports/lint-results-debug.html
            feature/explore/build/reports/lint-results-debug.html
            feature/favorite/build/reports/lint-results-debug.html
            feature/home/build/reports/lint-results-debug.html
            feature/note/build/reports/lint-results-debug.html
            feature/preview/build/reports/lint-results-debug.html
            feature/profile/build/reports/lint-results-debug.html
            feature/search/build/reports/lint-results-debug.html
            feature/settings/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  functions:
    name: Lint Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
