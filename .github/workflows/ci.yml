name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build, test and lint
    runs-on: ubuntu-latest
    # 40, not 30: the release build added an R8 pass to a job that already builds debug, runs 417
    # tests, diffs the goldens and lints. A timeout is a confusing way to learn a job got slower.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: the Robolectric-backed unit tests abort under 17 with
      # "Android SDK 36 requires Java 21" before running any test code.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its android-all-instrumented jars into ~/.m2 (~500MB), which
      # setup-gradle's ~/.gradle cache does not cover -- without this they are re-fetched
      # on every run. Keyed on the version catalog since that pins the Robolectric version.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # The Google Services plugin fails the build if this file is missing, and it is
      # gitignored (see app/.gitignore), so CI has to restore it from a secret.
      # Create the secret once with:  base64 -i app/google-services.json | pbcopy
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Generate it with 'base64 -i app/google-services.json'."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The release variant, which nothing else here compiles. Every other step in this job builds
      # debug -- assembleDebug above, testDebugUnitTest, verifyRoborazziDebug, lintDebug -- so a
      # dependency that reaches a module only through `debugImplementation` used to compile clean
      # all the way to a green tick and then fail `./gradlew assembleRelease` on someone's laptop.
      # That is not hypothetical: :feature:auth's `@Preview` resolved through the feature
      # convention's debugImplementation(ui-tooling) and broke compileReleaseKotlin for several
      # commits without this job noticing. It also puts R8 in the pipeline, so a missing keep rule
      # is caught here rather than in a release build.
      #
      # -x uploadCrashlyticsMappingFileRelease: assembleRelease wires that task in, and it uploads
      # a mapping file to Firebase. CI builds a release APK on every pull request and ships none of
      # them, so the upload would be noise in Crashlytics and a network call that can fail for
      # reasons that have nothing to do with the change under test. Real releases are built
      # elsewhere and still upload.
      #
      # There is no signing config, so this produces an unsigned APK. That is fine: the point is
      # that the variant compiles and shrinks, not that the artifact is installable.
      - name: Build release APK
        if: ${{ !cancelled() }}
        run: ./gradlew assembleRelease -x uploadCrashlyticsMappingFileRelease

      # Compiles the androidTest sources, which nothing else in this job does -- assembleDebug and
      # assembleRelease above, testDebugUnitTest, verifyRoborazziDebug and lintDebug below all stop
      # at main and test. It is the same gap the release step closes one variant over, and it hides
      # the same class of bug: :app's HiltGraphSmokeTest injects members over the generated
      # component, which is what walks the Hilt binding graph furthest, so an @Inject constructor
      # parameter hidden behind `implementation` instead of `api` fails here and nowhere else.
      # That is not hypothetical either -- it is exactly how :core:data's DataStore and Room
      # bindings broke while assembleDebug stayed green.
      #
      # Compiling is the whole point: connectedDebugAndroidTest would need an emulator, and the
      # failure this catches happens at compile time. `./scripts/run-test-lab.sh` still runs the
      # suites themselves on real devices.
      - name: Compile instrumented tests
        if: ${{ !cancelled() }}
        run: ./gradlew compileDebugAndroidTestKotlin

      # :core:domain is named explicitly because it is the one Kotlin Multiplatform module: its
      # unit tests run under `jvmTest`, not the Android `testDebugUnitTest` variant task, so a bare
      # testDebugUnitTest would skip them silently rather than fail. It was `test` while the module
      # was plain Kotlin JVM -- the task no longer exists, and a stale name here fails loudly, which
      # is the one good thing about naming it. Not `allTests`: that would pull in the Apple targets,
      # which cannot be built on this runner. Every other module is an Android library, so the
      # unqualified testDebugUnitTest reaches it, as does lintDebug below and verifyRoborazziDebug
      # in the four modules that apply the roborazzi plugin.
      #
      # `!cancelled()` like every other check in this job. Without it this was the one step a
      # failure above could skip, and the two steps immediately before it are the two most likely
      # to be the first thing red on a dependency change -- so a broken release variant used to
      # cost a whole extra fix-and-push cycle just to find out whether the tests also failed.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest :core:domain:jvmTest

      # What stops :core:domain's commonMain quietly stopping being common. It compiles against the
      # intersection of every target the module declares, so a `java.*` or JVM-only API added there
      # fails here -- while `jvmTest` above would happily compile and pass it. Metadata compilation
      # is a JVM task, so this works on this Linux runner with no Xcode and no Apple toolchain; what
      # it cannot cover is a Kotlin/Native codegen difference, which only
      # `:core:domain:iosSimulatorArm64Test` on a Mac would catch.
      - name: Verify shared sources stay common
        if: ${{ !cancelled() }}
        run: ./gradlew :core:domain:compileCommonMainKotlinMetadata

      # Uploaded here, before the screenshot step below re-runs the test task with a filter and
      # rewrites the screenshot modules' test-results/ down to just the screenshot classes.
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          # Globs, not the hand-maintained list of literal per-module paths this used to be.
          # upload-artifact matches with @actions/glob, so one pattern per depth covers every
          # module that has a report -- and, more to the point, every module that gains one. The
          # literal list had drifted three separate times (:core:ui, :feature:explore and
          # :feature:settings each reported nothing for a while), and each drift turned a failure
          # in that module into a red X with no report to open.
          #
          # Two depths because the modules are two deep (core/*, feature/*) and :app is one.
          # The task-name segment is a bare `*` rather than `test*` for the same reason the
          # module list is a glob: it was `test*` to cover :core:domain's `test` alongside every
          # other module's `testDebugUnitTest`, and the KMP conversion renamed that task to
          # `jvmTest`, which `test*` does not match. Nothing under test-results/ or reports/tests/
          # is written by anything but a test task, so matching them all costs nothing and is one
          # fewer name to keep in sync.
          path: |
            */build/reports/tests/*/
            */build/test-results/*/
            */*/build/reports/tests/*/
            */*/build/test-results/*/
          if-no-files-found: ignore

      # Split from the unit tests so a red X says which kind of thing broke: logic or pixels.
      # testDebugUnitTest *runs* the Roborazzi tests but never diffs them against the goldens
      # in each module's src/test/screenshots/ -- only verifyRoborazziDebug compares. Scoping it to the
      # screenshot package re-runs just those tests instead of the whole suite, which costs a
      # few seconds rather than doubling the test time. The filter is on the package, not a
      # class-name pattern, so a future screenshot test can't quietly escape verification.
      #
      # `!cancelled()` so a unit-test failure above still reports screenshot status in the same
      # run, instead of hiding it behind a fix-and-push cycle.
      #
      # On failure, download the screenshot-and-lint-reports artifact: the *_compare.png files
      # show reference / diff / actual. Re-record intended changes with recordRoborazziDebug.
      - name: Screenshot verification
        if: ${{ !cancelled() }}
        run: ./gradlew verifyRoborazziDebug --tests "com.jiahan.smartcamera.screenshot.*"

      # Also `!cancelled()`, for the same reason: report every check in one run rather than
      # surfacing them one fix-and-push at a time.
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      - name: Upload screenshot and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-and-lint-reports
          # Globs, for the reason the unit-test step above gives. Four modules capture screenshots
          # today (:core:ui, :feature:home, :feature:search, :feature:settings) and a fifth needs no
          # edit here to be diagnosable: a golden failure is only readable if its *_compare.png
          # files come back, and :core:ui's were missing from the literal list for a release after
          # NoteItemScreenshotTest moved there.
          path: |
            */build/outputs/roborazzi/
            */*/build/outputs/roborazzi/
            */build/reports/lint-results-debug.html
            */*/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  functions:
    name: Lint Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
