# Module-wide default Application for Robolectric-backed unit tests (@RunWith(AndroidJUnit4::class),
# which resolves to RobolectricTestRunner on the JVM). The real com.jiahan.smartcamera.MyApp installs
# the Firebase App Check provider in onCreate(), which throws under Robolectric because no default
# FirebaseApp is ever initialized there. A bare Application sidesteps that entirely.
#
# Most Robolectric test classes in app/src/test set this explicitly via
# @Config(application = android.app.Application::class) instead (see BaseScreenshotTest,
# EditNoteViewModelTest, ErrorHandlerTest, NotePreviewViewModelTest, PhotoPreviewViewModelTest,
# VideoPreviewViewModelTest) — an explicit class-level @Config always overrides this file, so this is
# harmless there. This file exists specifically for AuthScreenTest/HomeScreenTest, which live in
# app/src/sharedTest and also compile into the on-device androidTest variant (no Robolectric on that
# classpath), so they can't carry an org.robolectric.annotation.Config import.
application=android.app.Application
