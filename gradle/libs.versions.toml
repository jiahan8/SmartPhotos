[versions]
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
navigationCompose = "2.10.0"
kotlinxSerialization = "1.11.0"
# 0.8.0, not 0.8.0-0.6.x-compat: the compat variant keeps kotlinx's own Instant, while
# plain 0.8.0 defers Instant to kotlin.time in the stdlib, which the domain models already use.
kotlinxDatetime = "0.8.0"
coil = "3.6.1"
firebaseStorage = "22.0.1"
coroutines = "1.11.0"
hilt = "2.60.1"
hiltCompose = "1.4.0"
ksp = "2.3.4"
googleServices = "4.5.0"
firebaseBom = "34.18.0"
firebaseAnalytics = "23.2.0"
firebaseConfig = "23.1.0"
androidxMaterial3 = "1.4.0"
room = "2.8.4"
datastorePreferences = "1.2.1"
crashlytics = "3.0.8"
firebaseCrashlytics = "20.1.0"
firebaseMessaging = "25.1.2"
firebaseInAppmessagingDisplay = "22.0.3"
firebaseFirestore = "26.6.0"
firebaseAuth = "24.2.0"
firebaseFunctions = "22.1.1"
exoplayer = "1.11.0"
coreSplashScreen = "1.2.0"
javaxInject = "1"
mockk = "1.14.11"
turbine = "1.2.1"
androidxTestOrchestrator = "1.6.1"
androidxTestRunner = "1.7.0"
roborazzi = "1.73.0"
robolectric = "4.16.1"
playAppUpdate = "2.1.0"
firebaseAppcheckPlayintegrity = "19.4.1"
firebasePerf = "22.0.6"
firebasePerfPlugin = "2.0.2"
firebaseAppdistributionPlugin = "5.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# JUnit 4's replacement in :core:domain only, whose tests moved to commonTest and so have to
# compile for every target the module declares -- org.junit is JVM-only. Versioned by the
# Kotlin ref rather than a pin of its own: kotlin-test ships with the compiler and a mismatch
# between the two is a resolution failure, not a behaviour difference.
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# `collectAsStateWithLifecycle`, which :app and all nine features call. Declared rather than
# required: it reaches every one of them as a transitive of compose-ui through :core:ui's `api`, so
# it compiled for a long time with nothing naming it -- and was versioned by the Compose BOM instead
# of by the lifecycle pin the rest of this group shares.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# activity, not activity-compose: :core:data uses only ActivityResultLauncher and
# IntentSenderRequest, so it has no reason to pull Compose in. Declared rather than required --
# it also arrives transitively via firebase-auth -> androidx.fragment -> androidx.activity, which
# is an incidental path nothing promises to keep. Same release train as activity-compose, hence
# the shared version ref.
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxMaterial3" }
# Versioned by the Compose BOM. Declared because :core:ui names LazyListState in a public signature
# and uses androidx.compose.foundation directly; it would otherwise arrive only as a transitive of
# material3, which is a path nothing promises to keep.
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltCompose" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# The Compose-free half of the same library, for :app: it builds the singleton ImageLoader and
# loads a notification icon off the main thread, and draws no AsyncImage anywhere.
coil-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
# The two Coil components with no source reference anywhere, and the reason is the same for both:
# each ships a META-INF/services entry that Coil 3 discovers when it builds an ImageLoader --
# coil3.util.DecoderServiceLoaderTarget for the GIF decoder, coil3.util.FetcherServiceLoaderTarget
# for the network fetcher. Presence on the classpath *is* the registration, so there is nothing to
# import and no `components { }` block to grep for. Removing either compiles clean and fails at
# runtime. See the note where :app declares them.
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# Supplies `kotlinx.coroutines.tasks.await`, which :core:data calls on every Firebase Task.
# Declared rather than required -- firebase-common already brings it transitively (at 1.9.0, only
# reaching 1.11.0 via the coroutines BOM), but a Firebase upgrade that drops it would surface as
# an unexplained "unresolved reference: await".
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics", version.ref = "firebaseAnalytics" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage", version.ref = "firebaseStorage" }
firebase-config = { group = "com.google.firebase", name = "firebase-config", version.ref = "firebaseConfig" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastorePreferences" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlytics" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
firebase-inappmessaging-display = { group = "com.google.firebase", name = "firebase-inappmessaging-display", version.ref = "firebaseInAppmessagingDisplay" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebaseFirestore" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
firebase-functions = { group = "com.google.firebase", name = "firebase-functions", version.ref = "firebaseFunctions" }
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity", version.ref = "firebaseAppcheckPlayintegrity" }
firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug", version.ref = "firebaseAppcheckPlayintegrity" }
firebase-perf = { group = "com.google.firebase", name = "firebase-perf", version.ref = "firebasePerf" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoplayer" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "exoplayer" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashScreen" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-orchestrator = { group = "androidx.test", name = "orchestrator", version.ref = "androidxTestOrchestrator" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "playAppUpdate" }
play-app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "playAppUpdate" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Gradle plugin *artifacts*, consumed only by `build-logic/convention` as compileOnly dependencies
# so the convention plugins can compile against AGP's and Kotlin's DSL types. These are the same
# plugins the [plugins] block below applies by id, sharing the same version refs on purpose --
# a convention plugin compiled against a different AGP than the one applied fails at runtime with
# a NoSuchMethodError rather than at compile time.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
# build-logic only, so AndroidScreenshotConventionPlugin can configure `roborazzi { outputDir }`.
# Unlike AGP and Kotlin, this one is needed because the convention touches Roborazzi's own DSL type
# rather than just applying the plugin by id -- see the note in build-logic/convention.
roborazzi-gradlePlugin = { group = "io.github.takahirom.roborazzi", name = "roborazzi-gradle-plugin", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerfPlugin" }
firebase-appdistribution = { id = "com.google.firebase.appdistribution", version.ref = "firebaseAppdistributionPlugin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }